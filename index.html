 if(progress>=.9999){ctx.fillStyle='rgba(5,19,27,.76)';ctx.fillRect(0,405,w,380);ctx.textAlign='center';ctx.fillStyle='#a2ffce';ctx.font='900 92px system-ui';ctx.fillText('FINISH!',w/2,475);ctx.fillStyle='white';ctx.font='900 65px system-ui';ctx.fillText(total.toFixed(2)+' km',w/2,600);ctx.textAlign='left'}
 exportRaf=requestAnimationFrame(paintVideo);
}
function endExport(){if(!exporting)return;exporting=false;cancelAnimationFrame(exportRaf);playing=false;document.getElementById('play').textContent='▶ 再生';if(recorder&&recorder.state==='recording')recorder.stop();document.getElementById('record').textContent='● 縦動画を書き出す';}
document.getElementById('record').onclick=()=>{
 let btn=document.getElementById('record'),hint=document.getElementById('hint');
 if(exporting){endExport();return}
 if(!ready||!window.MediaRecorder||!out.captureStream){hint.textContent='このブラウザでは動画保存に対応していません。画面録画をご利用ください。';return}
 const formats=['video/mp4;codecs=avc1.42E01E','video/mp4','video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'];
 const mime=formats.find(x=>MediaRecorder.isTypeSupported(x));if(!mime){hint.textContent='動画形式に対応していません。';return}
 try{
  chunks=[];exportStream=out.captureStream(30);recorder=new MediaRecorder(exportStream,{mimeType:mime,videoBitsPerSecond:4500000});
  recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
  recorder.onerror=e=>{hint.textContent='録画エラーが発生しました。';console.warn(e)};
  recorder.onstop=()=>{let blob=new Blob(chunks,{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='hayakawa_longrun_3d_vertical.'+(mime.includes('mp4')?'mp4':'webm');document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);exportStream?.getTracks().forEach(t=>t.stop());hint.textContent='動画を保存しました。WebMの場合はDaVinci Resolve等でMP4へ変換できます。'};
  full=false;playing=false;draw(0);last=0;exporting=true;paintVideo();recorder.start(1000);playing=true;document.getElementById('play').textContent='Ⅱ 一時停止';btn.textContent='■ 保存して停止';hint.textContent='文字・距離・FINISH演出を含めて録画中。完走後に自動保存します。';
 }catch(e){exporting=false;cancelAnimationFrame(exportRaf);hint.textContent='録画できませんでした: '+e.message;console.warn(e)}
};
setTimeout(()=>{if(!ready)document.getElementById('notice').style.display='block'},12000);
